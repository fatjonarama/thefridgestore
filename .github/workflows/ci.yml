name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    # Every page is force-dynamic, so `next build` never actually queries the
    # database during the build step -- this placeholder only needs to be a
    # syntactically valid connection string to satisfy the app's own startup
    # check, it's never connected to.
    env:
      DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

  catalog-api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/catalog-api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: services/catalog-api/requirements-dev.txt

      - run: pip install -r requirements-dev.txt
      - run: pytest -q
